# The exhaustive tests: Go's (`make test-full`: -tags full, more seeds and longer
# captures than `make check` runs) and the API's (`make test-api-full`: every URL of
# the parity gates, the pipeline at full length; `make test-api-oracle`: every API test
# on the v6 oracle's read path). Too slow for every PR, so nightly and on demand.
name: full
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-full:
    name: Go, exhaustive (-tags full, -race)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: aintercept/go.mod
          cache-dependency-path: |
            aintercept/go.sum
      - run: make test-full

  api-full:
    name: API, exhaustive (every URL of the parity gates)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      # The tests' Postgres, as ui.yml's api job has it (the image docker-compose.yml pins, which
      # scripts/check-pins.py holds equal): without it every Postgres gate skipped here.
      postgres:
        image: postgres:17.10-alpine3.24@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        ports: ["15433:5432"]
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8 --encoding=UTF8
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: aintercept/go.mod
          cache-dependency-path: |
            aintercept/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.9"
      - name: Install (lockfile must be current)
        run: cd api && uv sync --locked
      # The Postgres gates (the session, person, directory and drawer pages against the oracle)
      # fail rather than skip without their server.
      - run: make test-api-full
        env:
          AINTERCEPT_TEST_PG: postgres://postgres@localhost:15433/postgres?sslmode=disable
          AINTERCEPT_TEST_PG_REQUIRED: "1"
      - run: make test-api-oracle
