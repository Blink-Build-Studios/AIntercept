# The exhaustive tests: Go's (`make test-full`: -tags full, more seeds and longer
# captures than `make check` runs) and the API's (`make test-api-full`: every URL of
# the parity gates, the pipeline at full length; `make test-api-oracle`: every API test
# on the v6 oracle's read path). Too slow for every PR, so nightly and on demand.
name: full
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-full:
    name: Go, exhaustive (-tags full, -race)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: aintercept/go.mod
          cache-dependency-path: |
            aintercept/go.sum
      - run: make test-full

  api-full:
    name: API, exhaustive (every URL of the parity gates)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: aintercept/go.mod
          cache-dependency-path: |
            aintercept/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.9"
      - name: Install (lockfile must be current)
        run: cd api && uv sync --locked
      - run: make test-api-full
      - run: make test-api-oracle
