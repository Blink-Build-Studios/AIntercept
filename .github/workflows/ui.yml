# Required checks (docs/ui/BUILD_PLAN.md §11): Go, query API, UI, repo hygiene, generated contract.
# Each job is one `make` target and they run in parallel; `make check` locally runs all of them.
# The final `check` job is the one required status: it passes only when every job did.
name: ui
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (gofmt, vet, tests with -race)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: aintercept/go.mod
          cache-dependency-path: |
            aintercept/go.sum
      - run: make check-go

  api:
    name: API (ruff, format, mypy strict, tests, coverage >= 90%)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.9"
      - name: Install (lockfile must be current)
        run: cd api && uv sync --locked
      - run: make check-api

  ui:
    name: UI (ESLint, lint-ui, typecheck, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install (lockfile must be current)
        run: cd ui && pnpm install --frozen-lockfile
      - run: make check-ui

  repo:
    name: Repo (exact pins + 14-day release age, no real identifiers, no secrets in history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - name: Install gitleaks 8.30.1 (checksum-verified)
        run: |
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz -C /usr/local/bin gitleaks
      - run: make check-repo

  generated:
    name: Generated contract is current (spec.ts and samples match the API)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.9"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install (lockfiles must be current)
        run: |
          cd ui && pnpm install --frozen-lockfile
          cd ../api && uv sync --locked
      - run: make check-generated

  check:
    name: check
    if: always()
    needs: [go, api, ui, repo, generated]
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success")' >/dev/null \
            || { echo '${{ toJSON(needs) }}' | jq -r 'to_entries[] | "\(.key): \(.value.result)"'; exit 1; }
