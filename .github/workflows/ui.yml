# Required checks (docs/ui/BUILD_PLAN.md §11): Go, query API, UI, repo hygiene, generated contract.
# Each step is a `make` target, so `make check` locally runs exactly this.
name: ui
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.9"
      - uses: actions/setup-go@v5
        with:
          go-version-file: aintercept/go.mod
          cache-dependency-path: |
            aintercept/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install gitleaks 8.30.1 (checksum-verified)
        run: |
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz -C /usr/local/bin gitleaks
      - name: Install (lockfiles must be current)
        run: |
          cd ui && pnpm install --frozen-lockfile
          cd ../api && uv sync --locked
      - name: Go (gofmt, vet, tests with -race)
        run: make check-go
      - name: API (ruff + security rules, format, mypy strict, tests, coverage >= 90%, requirements.json)
        run: make check-api
      - name: UI (ESLint incl. story per component, lint-ui tokens/channels/copy, typecheck, tests, requirements.json)
        run: make check-ui
      - name: Repo (exact pins + 14-day release age, no real identifiers, no secrets in history)
        run: make check-repo
      - name: Generated contract is current (spec.ts and samples match the API)
        run: make check-generated
