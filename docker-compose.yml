# Local stack: Envoy (TLS MITM on :443) + Go cert service (SDS) + Go observer
# (ext_proc) + the pipeline (Postgres and the workers; docs/PIPELINE.md) +
# fixture HTTPS origin. ./data/telemetry stands in for the bucket.
#
# Secret handling:
#   * The interception ROOT private key is NEVER mounted here — it stays on the
#     host and is installed only into the test client's trust store.
#   * The issuing INTERMEDIATE key is mounted read-only into certsvc only.
#   * The fixture's own CA (separate trust domain) is mounted read-only into
#     Envoy as the upstream trusted_ca, proving real upstream verification.

services:
  certsvc:
    build: &aintercept-build
      context: ./aintercept
    image: aintercept/aintercept:dev
    command: ["certsvc"]
    environment:
      CERTSVC_LISTEN: "0.0.0.0:18000"
      CERT_ALLOWLIST: "api.anthropic.com"
      INTERMEDIATE_CERT: "/certs/intermediate-ca.crt"
      INTERMEDIATE_KEY: "/certs/intermediate-ca.key"
      CA_CHAIN: "/certs/ca-chain.crt"
      LEAF_TTL: "24h"
    volumes:
      # Read-only, only the intermediate material the signer needs.
      - ./certs/intermediate-ca.crt:/certs/intermediate-ca.crt:ro
      - ./certs/intermediate-ca.key:/certs/intermediate-ca.key:ro
      - ./certs/ca-chain.crt:/certs/ca-chain.crt:ro
    restart: unless-stopped

  observer:
    build: *aintercept-build
    image: aintercept/aintercept:dev
    command: ["observer"]
    environment:
      OBSERVER_GRPC_LISTEN: "0.0.0.0:9000"
      OBSERVER_HTTP_LISTEN: "0.0.0.0:9001"
      OBSERVER_BUFFER_SIZE: "8192"
      # A debugging aid: bounded response-body previews in the observer's log
      # (the M1 smoke test turns it on via an override).
      DEV_LOG_BODIES: "${DEV_LOG_BODIES:-false}"
      # Interception mode: content-free (metadata only, the default) or full
      # (every request and response body is recorded too).
      INTERCEPTION_MODE: "${INTERCEPTION_MODE:-content-free}"
      # A customer Interceptor (docs/INTERCEPTOR.md), observe mode: every call
      # goes to it; nothing is enforced in this local stack (see
      # scripts/test-interceptor.sh for enforce).
      INTERCEPTOR_ENDPOINT: "${INTERCEPTOR_ENDPOINT:-}"
      INTERCEPTOR_CONTENT: "${INTERCEPTOR_CONTENT:-false}"
      # When set, events are also written as NDJSON to this file on the mounted
      # ./data volume (with bodies in full interception mode; never on stdout).
      OBSERVER_CAPTURE_FILE: "${OBSERVER_CAPTURE_FILE:-}"
      # Telemetry for the local UI, partitioned like object storage, in
      # ./data/telemetry (the query API's default data dir). In full interception
      # mode, bodies also go to ./data/telemetry/capture.
      OBSERVER_LOCAL_DIR: "${OBSERVER_LOCAL_DIR:-/data/telemetry}"
      # Flush every 15 s locally so the UI is close to live (object storage: 60 s).
      OBSERVER_S3_MAX_AGE_SECONDS: "${OBSERVER_S3_MAX_AGE_SECONDS:-15}"
      # Per-key ingest files (v1/keys/<key>/in/), each named in the recent index
      # (v1/recent/) the workers tail. A key's buffer flushes after 5 s locally
      # (default 30 s).
      OBSERVER_KEY_FLUSH_SECONDS: "${OBSERVER_KEY_FLUSH_SECONDS:-5}"
    ports:
      - "9001:9001" # /healthz + /stats for the smoke test and operators
    volumes:
      # Host-visible capture directory. Files here are gitignored.
      - ./data:/data
    restart: unless-stopped

  # The queryable data (docs/PIPELINE.md v7, §6). Its passwords are generated by scripts/up.sh
  # into the gitignored .env (never committed); on its first start, initdb.sh (the chart's) creates
  # the two logins (aintercept/internal/pg/logins.sql). Published on this machine only. The
  # schema has no migrations: after a schema change, start over with `docker volume rm` of pgdata.
  postgres:
    image: postgres:17.10-alpine3.24@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193  # the same pin as CI's service containers
    command: ["-c", "max_locks_per_transaction=256", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${AINTERCEPT_PG_PASSWORD:-}"
      POSTGRES_DB: aintercept
      POSTGRES_INITDB_ARGS: "--locale-provider=builtin --builtin-locale=C.UTF-8 --encoding=UTF8"
      AINTERCEPT_PG_WORKER_PASSWORD: "${AINTERCEPT_PG_WORKER_PASSWORD:-}"
      AINTERCEPT_PG_API_PASSWORD: "${AINTERCEPT_PG_API_PASSWORD:-}"
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/helm/aintercept/files/postgres/initdb.sh:/docker-entrypoint-initdb.d/10-aintercept.sh:ro
      - ./aintercept/internal/pg/logins.sql:/aintercept/logins.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-U", "postgres", "-d", "aintercept"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # The workers (docs/PIPELINE.md §2): tail the recent index under ./data/telemetry/v1/recent/,
  # apply each flagged key's ingest files and commit its rows to Postgres; retention every hour
  # (15 days, and a 3-day cap on raw data, applied ingest files and calls/ here).
  rollup:
    build: *aintercept-build
    image: aintercept/aintercept:dev
    command: ["rollup"]
    environment:
      ROLLUP_LOCAL_DIR: "/data/telemetry"
      # The worker login's DSN (its password from .env), with the spec's keepalives.
      ROLLUP_POSTGRES_URL: "postgres://aintercept_worker:${AINTERCEPT_PG_WORKER_PASSWORD:-}@postgres:5432/aintercept?sslmode=disable&keepalives_idle=10&keepalives_interval=5&keepalives_count=3&tcp_user_timeout=30000"
      ROLLUP_RETENTION_DAYS: "15"
      ROLLUP_RETENTION_RAW_DAYS: "3"
      ROLLUP_HTTP_LISTEN: "0.0.0.0:9004"
    ports:
      - "9004:9004" # /healthz, /lag, /metrics
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  fixture:
    build: ./fixture
    image: aintercept/fixture:dev
    environment:
      FIXTURE_LISTEN: "0.0.0.0:8443"
      FIXTURE_CERT: "/etc/ssl/fixture/fixture.crt"
      FIXTURE_KEY: "/etc/ssl/fixture/fixture.key"
    volumes:
      - ./certs/fixture/fixture.crt:/etc/ssl/fixture/fixture.crt:ro
      - ./certs/fixture/fixture.key:/etc/ssl/fixture/fixture.key:ro
    restart: unless-stopped

  envoy:
    image: envoyproxy/envoy:v1.39.6@sha256:1fde8efee875e4e4f6a39a90fe49d9338e1caacce5762034ef9fb4bbb9ad6aed  # same pin as the Helm chart
    depends_on:
      - certsvc
      - observer
      - fixture
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    ports:
      - "443:443"   # downstream TLS listener (the test client connects here)
      - "9901:9901" # Envoy admin
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      # Upstream trust bundle: Envoy must trust the fixture CA to connect. This
      # is REAL verification, not a bypass.
      - ./certs/fixture/upstream-ca.crt:/etc/ssl/upstream/upstream-ca.crt:ro
    restart: unless-stopped

volumes:
  pgdata: # the local Postgres's data (make down keeps it; `docker volume rm` to start over)
