{{- /*
Optional PodDisruptionBudgets, one per component, off by default (the
observer's is on whenever interceptor.enforce lists a scope). Voluntary
disruptions (node drains, cluster-autoscaler / Karpenter consolidation) honor
them, so a node replacement never takes a component to zero replicas. Envoy's
in-flight streams are drained by its own preStop hook either way.
*/ -}}
{{- range $name := list "envoy" "certsvc" "observer" "process" "api" }}
{{- $component := index $.Values $name | default dict }}
{{- $pdb := $component.podDisruptionBudget | default dict }}
{{- $enabled := $pdb.enabled }}
{{- if and $enabled (has $name (list "process" "api")) }}
{{- $enabled = (index $.Values $name).enabled }}
{{- end }}
{{- /* Enforced calls depend on the observer: with any enforce scope, its PDB is on. */ -}}
{{- if and (eq $name "observer") ($.Values.interceptor | default dict).enforce }}
{{- $enabled = true }}
{{- end }}
{{- if $enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- include "aintercept.labels" $ | nindent 4 }}
spec:
  {{- if hasKey $pdb "minAvailable" }}
  minAvailable: {{ $pdb.minAvailable }}
  {{- else }}
  maxUnavailable: {{ $pdb.maxUnavailable | default 1 }}
  {{- end }}
  selector:
    matchLabels: { app: {{ $name }} }
{{- end }}
{{- end }}
