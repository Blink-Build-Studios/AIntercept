{{- if and (eq .Values.cloud "digitalocean") (not .Values.objectStore.existingSecret) }}
# Static object-store credentials for DigitalOcean Spaces (no IRSA equivalent).
# Only created when inline creds are given AND no existingSecret is referenced.
# On AWS this Secret is never created; the observer uses IRSA instead.
apiVersion: v1
kind: Secret
metadata:
  name: aintercept-objectstore
  labels:
    {{- include "aintercept.labels" . | nindent 4 }}
type: Opaque
stringData:
  accessKeyId: {{ .Values.objectStore.accessKeyId | quote }}
  secretAccessKey: {{ .Values.objectStore.secretAccessKey | quote }}
{{- end }}
