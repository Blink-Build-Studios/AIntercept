{{- $sa := .Values.certsvc.serviceAccount | default dict }}
{{- $kms := .Values.certsvc.kms | default dict }}
{{- if $sa.create }}
# Its own identity, separate from the observer's: on AWS this is what gets KMS
# Sign on the intermediate key (via an EKS Pod Identity association, or IRSA
# with roleArn). The observer never can.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa.name | default "aintercept-certsvc" }}
  labels:
    app: certsvc
    {{- include "aintercept.labels" . | nindent 4 }}
  {{- if and (eq .Values.cloud "aws") $sa.roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ $sa.roleArn }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: certsvc
  labels:
    app: certsvc
    {{- include "aintercept.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.certsvc.replicas }}
  selector:
    matchLabels: { app: certsvc }
  template:
    metadata:
      labels: { app: certsvc }
    spec:
      {{- if .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      {{- end }}
      {{- if $sa.create }}
      serviceAccountName: {{ $sa.name | default "aintercept-certsvc" }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        # fsGroup owns the mounted CA Secret so the nonroot process can read it
        # with mode 0400 — the issuing CA private key is NOT world-readable.
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: certsvc
          image: {{ include "aintercept.ainterceptImage" . }}
          imagePullPolicy: {{ .Values.images.aintercept.pullPolicy }}
          args: ["certsvc"]
          env:
            - { name: CERTSVC_LISTEN, value: "0.0.0.0:18000" }
            - { name: CERT_ALLOWLIST, value: {{ .Values.interception.allowlist | quote }} }
            - { name: INTERMEDIATE_CERT, value: "/secrets/ca/intermediate-ca.crt" }
            {{- if $kms.keyId }}
            # The intermediate's private key lives in KMS; certsvc asks KMS to sign
            # and the CA Secret needs no intermediate-ca.key.
            - { name: INTERMEDIATE_KMS_KEY_ID, value: {{ $kms.keyId | quote }} }
            - { name: AWS_REGION, value: {{ $kms.region | default .Values.objectStore.region | quote }} }
            {{- else }}
            - { name: INTERMEDIATE_KEY, value: "/secrets/ca/intermediate-ca.key" }
            {{- end }}
            - { name: CA_CHAIN, value: "/secrets/ca/ca-chain.crt" }
            - { name: LEAF_TTL, value: {{ .Values.interception.leafTTL | quote }} }
            - { name: REQUIRE_NAME_CONSTRAINTS, value: {{ .Values.interception.requireNameConstraints | default false | quote }} }
            - { name: RENEW_SCAN_INTERVAL, value: {{ .Values.interception.renewScanInterval | default "1m" | quote }} }
          ports:
            - { name: grpc, containerPort: 18000 }
          volumeMounts:
            # Issuing key from a pre-created Secret, mounted read-only. NEVER a ConfigMap.
            - { name: ca, mountPath: /secrets/ca, readOnly: true }
          resources:
            {{- toYaml .Values.certsvc.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: ca
          secret:
            secretName: {{ .Values.interception.caSecretName }}
            # 0400 + pod fsGroup=65532: the issuing CA private key is readable ONLY
            # by the certsvc user, never world-readable. A co-scheduled sidecar or
            # `kubectl debug` process running as a different uid cannot read it.
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: certsvc
  labels:
    app: certsvc
    {{- include "aintercept.labels" . | nindent 4 }}
spec:
  selector: { app: certsvc }
  ports:
    - { name: grpc, port: 18000, targetPort: 18000 }
