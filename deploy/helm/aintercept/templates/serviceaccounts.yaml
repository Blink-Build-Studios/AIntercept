{{- /*
ServiceAccounts for rollup and api. Each component runs as its own, so the
observer's AWS role stays write-only. serviceAccount.create: false uses an
existing ServiceAccount named serviceAccount.name instead.
*/ -}}
{{- range $component := list "rollup" "api" }}
{{- $c := index $.Values $component }}
{{- $sa := $c.serviceAccount | default dict }}
{{- if and $c.enabled $sa.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aintercept.readerServiceAccountName" (dict "c" $c "component" $component "root" $) }}
  labels:
    app: {{ $component }}
    {{- include "aintercept.labels" $ | nindent 4 }}
  {{- if and (eq $.Values.cloud "aws") $sa.roleArn }}
  annotations:
    # IRSA. With EKS Pod Identity, leave roleArn empty and associate the role
    # with this ServiceAccount instead.
    eks.amazonaws.com/role-arn: {{ $sa.roleArn }}
  {{- end }}
{{- end }}
{{- end }}
