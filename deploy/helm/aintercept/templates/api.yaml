{{- if .Values.api.enabled }}
# The query API (api/) inside the cluster, as it runs in a client network: the
# UI connects to it (today through `kubectl port-forward svc/api 8787`). It is
# stateless (docs/PIPELINE.md §4): each request queries the object store's
# v1/merge and v1/keys folders (and a call's calls/<id> object for the raw
# view) through DuckDB's httpfs, so it keeps no tables, only scratch space, and
# an HPA on CPU sets the replica count.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
    {{- include "aintercept.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      # Its own ServiceAccount, never the observer's, so the observer's AWS role
      # stays write-only. Its role needs the reads in docs/PRODUCTION.md §7.
      serviceAccountName: {{ include "aintercept.readerServiceAccountName" (dict "c" .Values.api "component" "api" "root" $) }}
      {{- if .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: cache
          emptyDir: { sizeLimit: {{ .Values.api.stateless.cacheSizeLimit }} }
      {{- with (include "aintercept.scheduling" .Values.api) }}{{ . | nindent 6 }}{{ end }}
      containers:
        - name: api
          image: {{ include "aintercept.apiImage" . }}
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          env:
            - { name: AINTERCEPT_STORE, value: v1 }
            - { name: AINTERCEPT_S3_BUCKET, value: {{ .Values.objectStore.bucket | quote }} }
            - { name: AINTERCEPT_S3_PREFIX, value: {{ .Values.objectStore.prefix | quote }} }
            - { name: AINTERCEPT_S3_REGION, value: {{ .Values.objectStore.region | quote }} }
            {{- if .Values.objectStore.endpoint }}
            - { name: AINTERCEPT_S3_ENDPOINT, value: {{ .Values.objectStore.endpoint | quote }} }
            {{- end }}
            {{- if eq .Values.cloud "digitalocean" }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: {{ include "aintercept.objectStoreSecret" . }}, key: accessKeyId }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: {{ include "aintercept.objectStoreSecret" . }}, key: secretAccessKey }
            {{- end }}
            - { name: AINTERCEPT_CACHE_DIR, value: /data/cache }
            - { name: AINTERCEPT_CACHE_BYTES, value: {{ .Values.api.stateless.cacheBytes | quote }} }
            - { name: AINTERCEPT_MEMORY_LIMIT, value: {{ .Values.api.memoryLimit | quote }} }
            - name: AINTERCEPT_CONTAINER_MEMORY
              valueFrom:
                resourceFieldRef: { resource: limits.memory, divisor: "1" }
            - { name: AINTERCEPT_THREADS, value: {{ .Values.api.threads | quote }} }
            - { name: AINTERCEPT_REDIS_ADDR, value: {{ .Values.api.redisAddr | default (include "aintercept.redisAddr" .) | quote }} }
            {{- with .Values.api.auth }}
            {{- if .jwtHeader }}
            # Verify the identity-aware proxy's signed assertion on every request
            # (docs/PRODUCTION.md §5d).
            - { name: AINTERCEPT_AUTH_JWT_HEADER, value: {{ .jwtHeader | quote }} }
            - { name: AINTERCEPT_AUTH_JWKS_URL, value: {{ .jwksUrl | quote }} }
            - { name: AINTERCEPT_AUTH_AUDIENCE, value: {{ .audience | quote }} }
            {{- if .issuer }}
            - { name: AINTERCEPT_AUTH_ISSUER, value: {{ .issuer | quote }} }
            {{- end }}
            {{- end }}
            {{- end }}
          ports:
            - { name: http, containerPort: 8787 }
          readinessProbe:
            httpGet: { path: /api/v1/status, port: 8787 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v1/status, port: 8787 }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          volumeMounts:
            - { name: cache, mountPath: /data/cache }
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
    {{- include "aintercept.labels" . | nindent 4 }}
  {{- with .Values.api.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  selector: { app: api }
  ports:
    - { name: http, port: 8787, targetPort: 8787 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  labels:
    app: api
    {{- include "aintercept.labels" . | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: {{ .Values.api.stateless.minReplicas }}
  maxReplicas: {{ .Values.api.stateless.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.api.stateless.targetCPUUtilization }} }
{{- end }}
