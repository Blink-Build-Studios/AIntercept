{{- if .Values.api.enabled }}
# The query API (api/) inside the cluster, as it runs in a client network: the
# UI connects to it (today through `kubectl port-forward svc/api 8787`). It is
# stateless (docs/PIPELINE.md §6): each request reads its rows from Postgres in
# one snapshot and a call's raw member (one ranged GET) for the raw view, so it
# keeps nothing, and an HPA on CPU sets the replica count. It
# checks the database's schema version and is unready until it's one it reads
# (docs/PIPELINE.md §3.4); /api/v1/status (its readiness probe) reads Postgres,
# so a pod that can't is taken out of the Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
    {{- include "aintercept.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
      {{- with (include "aintercept.dsnPodAnnotations" (dict "c" .Values.api "root" $)) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      # Its own ServiceAccount, never the observer's, so the observer's AWS role
      # stays write-only. Its role needs the reads in docs/PRODUCTION.md §7.
      serviceAccountName: {{ include "aintercept.readerServiceAccountName" (dict "c" .Values.api "component" "api" "root" $) }}
      {{- if .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      {{- if .Values.postgres.caConfigMap }}
      volumes:
        # The RDS CA bundle the DSN's sslrootcert names (docs/PRODUCTION.md).
        - name: postgres-ca
          configMap: { name: {{ .Values.postgres.caConfigMap }} }
      {{- end }}
      {{- with (include "aintercept.scheduling" .Values.api) }}{{ . | nindent 6 }}{{ end }}
      containers:
        - name: api
          image: {{ include "aintercept.apiImage" . }}
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          env:
            # The API login's DSN (docs/PIPELINE.md §6), and nothing else of the Secret's.
            - name: AINTERCEPT_PG_DSN
              valueFrom:
                secretKeyRef: { name: {{ .Values.postgres.existingSecret }}, key: api-url }
            - { name: AINTERCEPT_S3_BUCKET, value: {{ .Values.objectStore.bucket | quote }} }
            - { name: AINTERCEPT_S3_PREFIX, value: {{ .Values.objectStore.prefix | quote }} }
            - { name: AINTERCEPT_S3_REGION, value: {{ .Values.objectStore.region | quote }} }
            {{- if .Values.objectStore.endpoint }}
            - { name: AINTERCEPT_S3_ENDPOINT, value: {{ .Values.objectStore.endpoint | quote }} }
            {{- end }}
            {{- if eq .Values.cloud "digitalocean" }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: {{ include "aintercept.objectStoreSecret" . }}, key: accessKeyId }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: {{ include "aintercept.objectStoreSecret" . }}, key: secretAccessKey }
            {{- end }}
            {{- with .Values.api.auth }}
            {{- if .jwtHeader }}
            # Verify the identity-aware proxy's signed assertion on every request
            # (docs/PRODUCTION.md §5d).
            - { name: AINTERCEPT_AUTH_JWT_HEADER, value: {{ .jwtHeader | quote }} }
            - { name: AINTERCEPT_AUTH_JWKS_URL, value: {{ .jwksUrl | quote }} }
            - { name: AINTERCEPT_AUTH_AUDIENCE, value: {{ .audience | quote }} }
            {{- if .issuer }}
            - { name: AINTERCEPT_AUTH_ISSUER, value: {{ .issuer | quote }} }
            {{- end }}
            {{- end }}
            {{- end }}
          ports:
            - { name: http, containerPort: 8787 }
          # Ready once the database holds this build's schema (a 503 until the
          # workers have applied it); alive whatever the database holds, so a
          # schema change or a Postgres outage never restarts the pod.
          readinessProbe:
            httpGet: { path: /api/v1/status, port: 8787 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8787 }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          {{- if .Values.postgres.caConfigMap }}
          volumeMounts:
            - { name: postgres-ca, mountPath: /etc/aintercept/postgres-ca, readOnly: true }
          {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
    {{- include "aintercept.labels" . | nindent 4 }}
  {{- with .Values.api.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  selector: { app: api }
  ports:
    - { name: http, port: 8787, targetPort: 8787 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  labels:
    app: api
    {{- include "aintercept.labels" . | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: {{ .Values.api.stateless.minReplicas }}
  maxReplicas: {{ .Values.api.stateless.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.api.stateless.targetCPUUtilization }} }
{{- end }}
