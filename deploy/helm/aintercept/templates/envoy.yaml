apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
  labels:
    app: envoy
    {{- include "aintercept.labels" . | nindent 4 }}
data:
  # The canonical multi-provider Envoy config, embedded from the chart's files/.
  # Its upstream clusters reference certsvc:18000 (cluster DNS) and the
  # observer on 127.0.0.1:9000, the other container in this pod.
  envoy.yaml: |
{{ include "aintercept.envoyConfig" . | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy
  labels:
    app: envoy
    {{- include "aintercept.labels" . | nindent 4 }}
spec:
  {{- if not .Values.envoy.autoscaling.enabled }}
  replicas: {{ .Values.envoy.autoscaling.minReplicas }}
  {{- end }}
  # Zero-downtime rollout: bring a NEW Envoy to Ready BEFORE removing any old one
  # (surge up, never drop below full capacity). maxUnavailable:0 is what makes a
  # deploy a cutover rather than a dip.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: { app: envoy }
  template:
    metadata:
      labels: { app: envoy }
      annotations:
        # Roll pods when the embedded Envoy config changes.
        checksum/config: {{ include "aintercept.envoyConfig" . | sha256sum }}
    spec:
      # The pod is the whole ingest stack: Envoy and the observer (its ext_proc
      # server, over localhost). Shutdown is ordered by the two preStop hooks:
      # Envoy drains and exits first, then the observer drains, flushes its
      # writer and exits. The grace period covers Envoy's drain plus the
      # observer's flush, and never less than observer.terminationGracePeriodSeconds.
      {{- $drain := .Values.envoy.drain | default dict }}
      {{- $preStop := $drain.preStopSleepSeconds | default 5 }}
      {{- $drainTime := $drain.drainTimeSeconds | default 180 }}
      {{- $flush := .Values.observer.flushSeconds | default 100 }}
      terminationGracePeriodSeconds: {{ max (add $preStop $drainTime $flush) (.Values.observer.terminationGracePeriodSeconds | default 300) }}
      serviceAccountName: {{ .Values.observer.serviceAccount.name }}
      {{- if .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      {{- end }}
      securityContext:
        # Non-root, per container below: Envoy as the stock image's `envoy`
        # user (uid 101), the observer as 65532. The internet-facing pod that
        # sees all decrypted traffic + API keys must not run privileged.
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      {{- with (include "aintercept.scheduling" .Values.envoy) }}{{ . | nindent 6 }}{{ end }}
      containers:
        - name: envoy
          image: {{ include "aintercept.envoyImage" . }}
          # Invoke the binary directly, bypassing the image's docker-entrypoint.sh
          # (which does root-only chown/UID setup that fails under our restricted
          # securityContext). The binary itself runs fine as uid 101.
          command: ["/usr/local/bin/envoy"]
          # --drain-time-s / --drain-strategy set the window and shape of a
          # GRACEFUL drain: Envoy sends `connection: close` / GOAWAY as in-flight
          # requests (incl. long streaming LLM turns) complete. Envoy only drains
          # like this on hot restart, an LDS change, or POST
          # /drain_listeners?graceful; on SIGTERM it closes listeners at once. So
          # the preStop hook below starts the drain and waits for it, and SIGTERM
          # only arrives after. 'immediate' starts draining at once rather than
          # ramping, which is what we want for a clean cutover.
          args:
            - "-c"
            - "/etc/envoy/envoy.yaml"
            - "--log-level"
            - "info"
            - "--drain-time-s"
            - {{ $drainTime | quote }}
            - "--drain-strategy"
            - "immediate"
          lifecycle:
            preStop:
              # 1. Sleep preStopSleepSeconds so the LoadBalancer + kube endpoints
              #    stop routing NEW connections here (that removal propagates
              #    async once the pod is Terminating). Envoy serves normally.
              # 2. POST /drain_listeners?graceful: Envoy starts its graceful drain
              #    (--drain-time-s), closing connections as their requests finish.
              # 3. Wait until no request is in flight on the proxied listener, or
              #    drainTimeSeconds pass, whichever is first. Only then does the
              #    hook return and Kubernetes send SIGTERM.
              # bash for /dev/tcp: the image has no curl/wget. Any admin error
              # falls through to the bounded wait, never to an early exit.
              exec:
                command:
                  - /usr/bin/bash
                  - -c
                  - |
                    admin() { exec 3<>/dev/tcp/127.0.0.1/9901 || return 1; printf '%s %s HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' "$1" "$2" >&3; cat <&3; exec 3<&-; }
                    sleep {{ $preStop }}
                    admin POST '/drain_listeners?graceful' >/dev/null 2>&1
                    deadline=$((SECONDS + {{ $drainTime }}))
                    while [ "$SECONDS" -lt "$deadline" ]; do
                      active=$(admin GET '/stats?filter=^http\.ingress_https\.downstream_rq_active$' 2>/dev/null | sed -n 's/^http\.ingress_https\.downstream_rq_active: *//p')
                      [ "$active" = "0" ] && break
                      sleep 2
                    done
                    # 4. Exit now, closing whatever is still open: WebSockets never
                    #    end on their own. Each closed stream's ext_proc stream
                    #    ends, so the observer records its connection row, and the
                    #    observer gets the rest of the grace period to flush.
                    admin POST '/quitquitquit' >/dev/null 2>&1
          ports:
            - { name: https, containerPort: 443 }
            - { name: admin, containerPort: 9901 }
          volumeMounts:
            - { name: config, mountPath: /etc/envoy, readOnly: true }
          readinessProbe:
            # /ready reports NOT ready while draining, so a terminating pod is pulled
            # from rotation promptly.
            httpGet: { path: /ready, port: 9901 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            # Liveness uses /server_info (200 whenever the process is alive, even
            # while draining) — NOT /ready — so a transient not-ready or an in-
            # progress drain can never trip liveness and KILL an otherwise healthy
            # pod mid-connection.
            httpGet: { path: /server_info, port: 9901 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.envoy.resources | nindent 12 }}
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            # Envoy binds the privileged port 443; it needs NET_BIND_SERVICE.
            # We drop everything else and forbid privilege escalation beyond that.
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
        {{- include "aintercept.observerContainer" . | nindent 8 }}
      volumes:
        - name: config
          configMap: { name: envoy-config }
        {{- include "aintercept.observerVolumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: envoy
  labels:
    app: envoy
    {{- include "aintercept.labels" . | nindent 4 }}
  {{- /*
  Per-cloud defaults, then envoy.service.annotations merged OVER them, rendered
  once. A user value replaces a default with the same key (e.g. setting
  aws-load-balancer-type: external to hand the Service to the AWS Load
  Balancer Controller); writing both would emit a duplicate key.
  AWS: a Network Load Balancer (L4, preserves TLS to Envoy).
  DigitalOcean: an L4 LB in passthrough, so Envoy terminates TLS itself.
  */}}
  {{- $proxyProtocol := (.Values.envoy.proxyProtocol | default dict).enabled }}
  {{- $defaults := dict }}
  {{- if eq .Values.cloud "aws" }}
  {{- $_ := set $defaults "service.beta.kubernetes.io/aws-load-balancer-type" "nlb" }}
  {{- if $proxyProtocol }}
  {{- $_ := set $defaults "service.beta.kubernetes.io/aws-load-balancer-proxy-protocol" "*" }}
  {{- end }}
  {{- else if eq .Values.cloud "digitalocean" }}
  {{- $_ := set $defaults "service.beta.kubernetes.io/do-loadbalancer-protocol" "tcp" }}
  {{- if $proxyProtocol }}
  {{- $_ := set $defaults "service.beta.kubernetes.io/do-loadbalancer-enable-proxy-protocol" "true" }}
  {{- end }}
  {{- end }}
  {{- $annotations := merge (deepCopy (.Values.envoy.service.annotations | default dict)) $defaults }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.envoy.service.type }}
  externalTrafficPolicy: {{ .Values.envoy.service.externalTrafficPolicy | default "Local" }}
  {{- with .Values.envoy.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector: { app: envoy }
  ports:
    - { name: https, port: 443, targetPort: 443 }
{{- if and .Values.envoy.autoscaling.enabled (eq .Values.envoy.autoscaling.mode "keda") }}
---
# Internal-only Service exposing Envoy's admin port so KEDA can poll live
# connection stats. Never exposed outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: envoy-admin
  labels:
    app: envoy
    {{- include "aintercept.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: { app: envoy }
  ports:
    - { name: admin, port: 9901, targetPort: 9901 }
{{- end }}
{{- if .Values.envoy.autoscaling.enabled }}
{{- if eq .Values.envoy.autoscaling.mode "keda" }}
---
# KEDA scales Envoy on ACTIVE DOWNSTREAM CONNECTIONS — the load signal that
# actually matters for a proxy teeing long-lived streams, not CPU. KEDA polls
# Envoy's admin /stats JSON directly (no Prometheus). The admin Service LB-routes
# to one replica, so the sampled count is treated as representative of an
# evenly-balanced L4 fleet; KEDA keeps that per-pod count at/under the target.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: envoy
  labels:
    app: envoy
    {{- include "aintercept.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: envoy
  minReplicaCount: {{ .Values.envoy.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.envoy.autoscaling.maxReplicas }}
  pollingInterval: {{ .Values.envoy.autoscaling.pollingInterval }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
  triggers:
    - type: metrics-api
      metadata:
        url: "http://envoy-admin.{{ .Release.Namespace }}.svc.cluster.local:9901/stats?format=json&filter=^http\\.ingress_https\\.downstream_cx_active$"
        valueLocation: "stats.0.value"
        targetValue: "{{ .Values.envoy.autoscaling.targetConnectionsPerPod }}"
        # Envoy admin serves plaintext JSON on the cluster-internal port.
        unsafeSsl: "false"
{{- else }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: envoy
  labels:
    app: envoy
    {{- include "aintercept.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: envoy
  minReplicas: {{ .Values.envoy.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.envoy.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.envoy.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      # Wait 5 min of sustained low load before scaling in, so brief lulls don't
      # thrash the fleet.
      stabilizationWindowSeconds: 300
{{- end }}
{{- end }}
