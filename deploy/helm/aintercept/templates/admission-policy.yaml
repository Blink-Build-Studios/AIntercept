{{- if (.Values.admissionPolicy | default dict).enabled }}
# Second layer behind the compiled-out dev body capture: reject any pod in this
# release's namespace that sets the dev body-capture env vars, so a production
# deploy can't even carry them. (Values injected via envFrom aren't visible to
# admission; the production binary has no capture code regardless.)
# Requires Kubernetes >= 1.30 (ValidatingAdmissionPolicy GA).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-deny-dev-body-capture
  labels:
    {{- include "aintercept.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        # pods/ephemeralcontainers is how `kubectl debug` adds a container.
        resources: ["pods", "pods/ephemeralcontainers"]
  variables:
    - name: containers
      expression: >-
        object.spec.containers
        + (has(object.spec.initContainers) ? object.spec.initContainers : [])
        + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
  validations:
    - expression: >-
        variables.containers.all(c, !has(c.env) ||
        c.env.all(e, !(e.name in ['DEV_LOG_BODIES', 'DEV_CAPTURE_FULL_BODIES'])))
      message: "DEV_LOG_BODIES / DEV_CAPTURE_FULL_BODIES are dev-only and not allowed in this namespace"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-deny-dev-body-capture
  labels:
    {{- include "aintercept.labels" . | nindent 4 }}
spec:
  policyName: {{ .Release.Namespace }}-{{ .Release.Name }}-deny-dev-body-capture
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
{{- end }}
