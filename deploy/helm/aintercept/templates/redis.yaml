{{- if .Values.redis.enabled }}
# Redis, in the cluster (docs/PIPELINE.md): coordination only. Ingest flags
# dirty keys here, and the rollups take their per-key locks here. Nothing that
# correctness depends on lives in it: losing it costs freshness, and the
# rollups' sweep re-flags every recent key from the object store.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app: redis
    {{- include "aintercept.labels" . | nindent 4 }}
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      {{- with (include "aintercept.scheduling" .Values.redis) }}{{ . | nindent 6 }}{{ end }}
      containers:
        - name: redis
          image: {{ include "aintercept.image" .Values.images.redis }}
          imagePullPolicy: IfNotPresent
          args: ["--appendonly", "yes", "--dir", "/data", "--save", ""]
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.redis.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.redis.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: redis
    {{- include "aintercept.labels" . | nindent 4 }}
spec:
  selector: { app: redis }
  ports:
    - { name: redis, port: 6379, targetPort: 6379 }
{{- end }}
