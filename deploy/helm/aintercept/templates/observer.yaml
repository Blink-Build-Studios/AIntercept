{{- include "aintercept.validate" . -}}
{{- if .Values.observer.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.observer.serviceAccount.name }}
  labels:
    app: observer
    {{- include "aintercept.labels" . | nindent 4 }}
  {{- if and (eq .Values.cloud "aws") .Values.observer.serviceAccount.roleArn }}
  annotations:
    # IRSA: binds this ServiceAccount to an IAM role so the observer gets
    # keyless S3 credentials via the cluster OIDC provider. With EKS Pod
    # Identity, leave roleArn empty and associate the role with this
    # ServiceAccount instead.
    eks.amazonaws.com/role-arn: {{ .Values.observer.serviceAccount.roleArn }}
  {{- end }}
---
{{- end }}
# The observer runs in the Envoy pod (templates/envoy.yaml, _observer.tpl):
# each ingress pod is the whole ingest stack. This Service reaches the
# observers' HTTP port (/healthz, /healthz/path, /stats) for operators and
# kill-switch pollers; ext_proc never leaves the pod.
apiVersion: v1
kind: Service
metadata:
  name: observer
  labels:
    app: observer
    {{- include "aintercept.labels" . | nindent 4 }}
spec:
  selector: { app: envoy }
  ports:
    - { name: http, port: 9001, targetPort: 9001 }
