{{- include "aintercept.validate" . -}}
{{- if .Values.observer.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.observer.serviceAccount.name }}
  labels:
    app: observer
    {{- include "aintercept.labels" . | nindent 4 }}
  {{- if and (eq .Values.cloud "aws") .Values.observer.serviceAccount.roleArn }}
  annotations:
    # IRSA: binds this ServiceAccount to an IAM role so the observer gets
    # keyless S3 credentials via the cluster OIDC provider. With EKS Pod
    # Identity, leave roleArn empty and associate the role with this
    # ServiceAccount instead.
    eks.amazonaws.com/role-arn: {{ .Values.observer.serviceAccount.roleArn }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observer
  labels:
    app: observer
    {{- include "aintercept.labels" . | nindent 4 }}
spec:
  {{- if not .Values.observer.autoscaling.enabled }}
  replicas: {{ .Values.observer.autoscaling.minReplicas }}
  {{- end }}
  selector:
    matchLabels: { app: observer }
  template:
    metadata:
      labels: { app: observer }
    spec:
      # The shutdown delay plus the longest streaming call it waits to finish
      # (GracefulStop drains in-flight streams), so Kubernetes never kills mid-call.
      terminationGracePeriodSeconds: {{ .Values.observer.terminationGracePeriodSeconds | default 200 }}
      serviceAccountName: {{ .Values.observer.serviceAccount.name }}
      {{- if .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      {{- with (include "aintercept.scheduling" .Values.observer) }}{{ . | nindent 6 }}{{ end }}
      containers:
        - name: observer
          image: {{ include "aintercept.ainterceptImage" . }}
          imagePullPolicy: {{ .Values.images.aintercept.pullPolicy }}
          args: ["observer"]
          env:
            - { name: OBSERVER_GRPC_LISTEN, value: "0.0.0.0:9000" }
            - { name: OBSERVER_HTTP_LISTEN, value: "0.0.0.0:9001" }
            - { name: OBSERVER_BUFFER_SIZE, value: {{ .Values.observer.bufferSize | quote }} }
            - { name: OBSERVER_LOG_LEVEL, value: {{ .Values.observer.logLevel | default "info" | quote }} }
            - { name: OBSERVER_SHUTDOWN_DELAY_SECONDS, value: {{ .Values.observer.shutdownDelaySeconds | default 15 | quote }} }
            - { name: OBSERVER_CLIENT_IP_HEADERS, value: {{ .Values.observer.clientIPHeaders | default list | join "," | quote }} }
            - name: OBSERVER_INSTANCE
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            {{- if .Values.observer.keyHashSaltSecretsManagerId }}
            # Read from AWS Secrets Manager at startup (Pod Identity / IRSA creds).
            - { name: OBSERVER_KEY_HASH_SALT_SECRET_ID, value: {{ .Values.observer.keyHashSaltSecretsManagerId | quote }} }
            {{- else if .Values.observer.keyHashSaltSecret }}
            - name: OBSERVER_KEY_HASH_SALT
              valueFrom:
                secretKeyRef: { name: {{ .Values.observer.keyHashSaltSecret }}, key: salt }
            {{- else if .Values.observer.keyHashSalt }}
            - { name: OBSERVER_KEY_HASH_SALT, value: {{ .Values.observer.keyHashSalt | quote }} }
            {{- end }}
            # ── Object store sink ──
            - { name: OBSERVER_S3_BUCKET, value: {{ .Values.objectStore.bucket | quote }} }
            - { name: OBSERVER_S3_PREFIX, value: {{ .Values.objectStore.prefix | quote }} }
            - { name: INTERCEPTION_MODE, value: {{ include "aintercept.interceptionMode" . | quote }} }
            {{- with .Values.interceptor }}
            {{- if .endpoint }}
            # ── Interceptor (docs/INTERCEPTOR.md) ──
            - { name: INTERCEPTOR_ENDPOINT, value: {{ .endpoint | quote }} }
            - { name: INTERCEPTOR_CONTENT, value: {{ .content | toString | quote }} }
            - { name: INTERCEPTOR_DEADLINE_MS, value: {{ .deadlineMs | toString | quote }} }
            - { name: INTERCEPTOR_ON_ERROR, value: {{ .onError | quote }} }
            {{- if .tls.enabled }}
            - { name: INTERCEPTOR_TLS, value: "true" }
            {{- if .tls.serverName }}
            - { name: INTERCEPTOR_TLS_SERVER_NAME, value: {{ .tls.serverName | quote }} }
            {{- end }}
            {{- if and .tls.secretName .tls.ca }}
            - { name: INTERCEPTOR_TLS_CA_FILE, value: /etc/aintercept/interceptor-tls/ca.crt }
            {{- end }}
            {{- if and .tls.secretName .tls.clientCert }}
            - { name: INTERCEPTOR_TLS_CERT_FILE, value: /etc/aintercept/interceptor-tls/tls.crt }
            - { name: INTERCEPTOR_TLS_KEY_FILE, value: /etc/aintercept/interceptor-tls/tls.key }
            {{- end }}
            {{- end }}
            {{- if .tokenSecret }}
            - name: INTERCEPTOR_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ .tokenSecret }}, key: token }
            {{- end }}
            {{- end }}
            {{- end }}
            - { name: OBSERVER_S3_REGION, value: {{ .Values.objectStore.region | quote }} }
            - { name: OBSERVER_S3_MAX_BYTES, value: {{ .Values.objectStore.maxBytes | quote }} }
            - { name: OBSERVER_S3_MAX_EVENTS, value: {{ .Values.objectStore.maxEvents | quote }} }
            - { name: OBSERVER_S3_MAX_AGE_SECONDS, value: {{ .Values.objectStore.maxAgeSeconds | quote }} }
            {{- if .Values.objectStore.endpoint }}
            - { name: OBSERVER_S3_ENDPOINT, value: {{ .Values.objectStore.endpoint | quote }} }
            {{- end }}
            {{- if .Values.objectStore.forcePathStyle }}
            - { name: OBSERVER_S3_FORCE_PATH_STYLE, value: "true" }
            {{- end }}
            # ── Unrecognized-shape sampling (structure-only; same bucket, schema-samples/ prefix) ──
            {{- $sampling := .Values.observer.schemaSampling | default dict }}
            {{- if and (hasKey $sampling "enabled") (not $sampling.enabled) }}
            - { name: OBSERVER_SCHEMA_SAMPLING, value: "false" }
            {{- end }}
            - { name: OBSERVER_SCHEMA_SAMPLES_PER_MINUTE, value: {{ $sampling.samplesPerMinute | default 120 | quote }} }
            {{- if eq .Values.cloud "digitalocean" }}
            # Static Spaces credentials (DO has no IRSA). Sourced from a Secret.
            - name: OBSERVER_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: {{ include "aintercept.objectStoreSecret" . }}, key: accessKeyId }
            - name: OBSERVER_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: {{ include "aintercept.objectStoreSecret" . }}, key: secretAccessKey }
            {{- end }}
            # Peers for the fleet memory-budget average (/stats/fleet).
            - { name: OBSERVER_PEERS_DNS, value: "observer-pods.{{ .Release.Namespace }}.svc.cluster.local" }
            {{- with .Values.observer.memoryBudget }}
            - { name: OBSERVER_MEMORY_BUDGET, value: {{ . | quote }} }
            {{- end }}
            {{- $probe := .Values.observer.pathProbe | default dict }}
            {{- if $probe.enabled }}
            # ── Interception-path health check (/healthz/path) ──
            - { name: OBSERVER_PROBE_HOSTS, value: {{ .Values.interception.allowlist | quote }} }
            - { name: OBSERVER_PROBE_TARGET, value: {{ $probe.target | default "envoy:443" | quote }} }
            - { name: OBSERVER_PROBE_TARGETS, value: {{ join "," $probe.targets | quote }} }
            - { name: OBSERVER_PROBE_INTERVAL, value: {{ $probe.interval | default "15s" | quote }} }
            - { name: OBSERVER_PROBE_MIN_LEAF_VALIDITY, value: {{ $probe.minLeafValidity | default "30m" | quote }} }
            - { name: OBSERVER_PROBE_ROOTS, value: "/etc/aintercept/ca/ca-chain.crt" }
            {{- end }}
          ports:
            - { name: grpc, containerPort: 9000 }
            - { name: http, containerPort: 9001 }
          readinessProbe:
            httpGet: { path: /healthz, port: 9001 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 9001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.observer.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          {{- $icTLS := and .Values.interceptor.endpoint .Values.interceptor.tls.enabled .Values.interceptor.tls.secretName }}
          {{- if or $probe.enabled $icTLS }}
          volumeMounts:
            {{- if $probe.enabled }}
            - { name: ca-chain, mountPath: /etc/aintercept/ca, readOnly: true }
            {{- end }}
            {{- if $icTLS }}
            - { name: interceptor-tls, mountPath: /etc/aintercept/interceptor-tls, readOnly: true }
            {{- end }}
      volumes:
        {{- if $probe.enabled }}
        # Only the public chain is projected; the intermediate key in the same
        # Secret is never mounted into the observer.
        - name: ca-chain
          secret:
            secretName: {{ .Values.interception.caSecretName }}
            items:
              - { key: ca-chain.crt, path: ca-chain.crt }
        {{- end }}
        {{- if $icTLS }}
        - name: interceptor-tls
          secret:
            secretName: {{ .Values.interceptor.tls.secretName }}
        {{- end }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: observer
  labels:
    app: observer
    {{- include "aintercept.labels" . | nindent 4 }}
spec:
  selector: { app: observer }
  ports:
    - { name: grpc, port: 9000, targetPort: 9000 }
    - { name: http, port: 9001, targetPort: 9001 }
---
# Headless: resolves to every ready observer pod, so Envoy sees each pod as
# its own endpoint and weights new ext_proc streams by the load each reports
# (ORCA). Through the ClusterIP Service above, Envoy's few long-lived HTTP/2
# connections would pin all streams to whichever pods they happened to reach.
# Also how pods find each other for the fleet average (/stats/fleet).
apiVersion: v1
kind: Service
metadata:
  name: observer-pods
  labels:
    app: observer
    {{- include "aintercept.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: { app: observer }
  ports:
    - { name: grpc, port: 9000, targetPort: 9000 }
    - { name: http, port: 9001, targetPort: 9001 }
{{- if .Values.observer.autoscaling.enabled }}
{{- if eq (.Values.observer.autoscaling.mode | default "cpu") "keda" }}
---
# KEDA scales the observer on whichever is higher: CPU, or the fleet's
# memory-budget utilization (bytes held for in-flight traffic / budget,
# averaged over all pods by any pod's /stats/fleet). Scaling starts well
# before the budget is reached; new pods get new streams through ORCA
# weighting, since streams already open stay on their pod.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: observer
  labels:
    app: observer
    {{- include "aintercept.labels" . | nindent 4 }}
  annotations:
    # Switching from mode cpu: KEDA adopts the existing HPA (same name)
    # instead of its webhook rejecting a second autoscaler for the Deployment.
    scaledobject.keda.sh/transfer-hpa-ownership: "true"
spec:
  scaleTargetRef:
    name: observer
  minReplicaCount: {{ .Values.observer.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.observer.autoscaling.maxReplicas }}
  pollingInterval: {{ .Values.observer.autoscaling.pollingInterval | default 15 }}
  advanced:
    horizontalPodAutoscalerConfig:
      name: observer
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "{{ .Values.observer.autoscaling.targetCPUUtilizationPercentage }}"
    - type: metrics-api
      # Value: replicas scale with fleet average / target.
      metricType: Value
      metadata:
        url: "http://observer.{{ .Release.Namespace }}.svc.cluster.local:9001/stats/fleet"
        valueLocation: "avg_utilization_percent"
        targetValue: "{{ .Values.observer.autoscaling.targetMemoryBudgetPercent }}"
{{- else }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: observer
  labels:
    app: observer
    {{- include "aintercept.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: observer
  minReplicas: {{ .Values.observer.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.observer.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.observer.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
{{- end }}
{{- end }}
