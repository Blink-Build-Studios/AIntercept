# ── Cloud target ──────────────────────────────────────────────────────────────
# Selects cloud-specific wiring: how the observer authenticates to the object
# store, and which LoadBalancer annotations the Envoy Service gets.
#   aws          → S3 via IRSA (keyless; serviceAccount.roleArn), AWS NLB
#   digitalocean → Spaces via static keys (from a Secret), DO LB
cloud: digitalocean

# ── Interception mode ─────────────────────────────────────────────────────────
# What AIntercept records:
#   content-free → metadata only: headers, token counts, timings, model and tool
#                  names, the agents' own analytics. No request or response body.
#   full         → everything above plus every request and response body. The
#                  observer writes the stream with bodies under
#                  <objectStore.prefix>/capture, and the processor and the API
#                  read it, so the UI shows prompt text, commands, patches and
#                  exit codes. Far more data: size the object store for it.
# Independent of the interceptor (below): whether a customer's Interceptor sees
# bodies is its own setting.
interceptionMode: content-free

# ── Interceptor (the control-plane hook) ─────────────────────────────────────
# A customer's gRPC service implementing interceptor/v1 (docs/INTERCEPTOR.md)
# receives every call: OnCallStart, OnMessage (with content on) and
# OnCallComplete. Observe mode (everywhere, by default) never touches
# traffic; hosts and paths listed under `enforce` go through the enforcing
# filter, where the Interceptor's verdicts are applied.
interceptor:
  # host:port of the Interceptor. Empty: no Interceptor.
  endpoint: ""
  # Send request and response bodies to the Interceptor (OnMessage). Separate
  # from interceptionMode: the Interceptor can act on bodies AIntercept doesn't
  # record.
  content: false
  # Enforce: how long the Interceptor has to answer each callback, and what
  # happens when it doesn't (or fails): deny (fail closed) or allow.
  deadlineMs: 50
  onError: deny
  # Enforce scopes: each host (and optional path prefixes) whose calls the
  # Interceptor's verdicts apply to. Everything else is observed only.
  #   - host: api.anthropic.com
  #     paths: ["/v1/messages"]
  #   - host: chatgpt.com
  #     paths: ["/backend-api/codex/responses"]
  enforce: []
  # TLS to the Interceptor. secretName holds ca.crt (verifies the server) and,
  # for mutual TLS, tls.crt/tls.key (the observer's client certificate).
  tls:
    enabled: false
    secretName: ""
    # Verify the server with the Secret's ca.crt (false: the system roots).
    ca: true
    # Present the Secret's tls.crt/tls.key as a client certificate.
    clientCert: false
    serverName: ""
  # A Secret whose `token` key is sent as "authorization: Bearer <token>".
  tokenSecret: ""

# ── Network policy ────────────────────────────────────────────────────────────
# Restrict Envoy's UNAUTHENTICATED admin port (9901) to the KEDA operator only.
# Requires a NetworkPolicy-enforcing CNI. Disable only if your cluster can't
# enforce policies AND you have another control around 9901.
networkPolicy:
  enabled: true
  kedaNamespace: keda

images:
  # Envoy is the stock upstream image; the one built here is `aintercept`, which
  # runs as the observer or certsvc (the Deployment's args pick the mode).
  # Each image deploys by digest when `digest` is set (repository@digest; the tag
  # is then informational). Production should always set digests.
  envoy:
    repository: envoyproxy/envoy
    tag: v1.39.6
    digest: sha256:1fde8efee875e4e4f6a39a90fe49d9338e1caacce5762034ef9fb4bbb9ad6aed
  aintercept:
    repository: aintercept/aintercept
    tag: dev
    digest: ""
    pullPolicy: IfNotPresent
  # The query API (api/Dockerfile), when `api.enabled`.
  api:
    repository: aintercept/api
    tag: dev
    digest: ""
    pullPolicy: IfNotPresent

# Image pull secret name (e.g. a DO Container Registry secret). Empty => none.
imagePullSecret: ""

# ── Interception ──────────────────────────────────────────────────────────────
interception:
  # Hostnames Envoy will intercept + mint leaf certs for. The Envoy config
  # shipped in this chart (templates/envoy-config.yaml) must have matching
  # filter chains / upstream clusters.
  allowlist: "api.anthropic.com,api.openai.com,generativelanguage.googleapis.com,chatgpt.com,ab.chatgpt.com,ws.chatgpt.com,*.oaiusercontent.com,bzr.openai.com,claude.ai,a.claude.ai,cloudflare-ech.com"
  # Leaf cert lifetime. certsvc mints short-lived leaves and PROACTIVELY renews
  # them (background scan every renewScanInterval, re-minting any leaf within
  # leafTTL/4 of expiry and hot-swapping it over SDS), so a leaf never ages out
  # from under Envoy. Keep this short for a small blast radius.
  leafTTL: "6h"
  # How often certsvc scans issued leaves for impending expiry.
  renewScanInterval: "1m"
  # Name of the pre-created Secret holding the issuing intermediate CA material
  # (intermediate-ca.crt, intermediate-ca.key, ca-chain.crt). NEVER a ConfigMap.
  # Create it before install (see docs/DEPLOY_DOKS.md).
  caSecretName: interception-ca
  # The issuing intermediate is supplied, not minted by this chart. It should be
  # name-constrained to the routed domains so its key can't sign for any other
  # site. certsvc always verifies at startup that every allowlisted host gets a
  # leaf clients will accept (and refuses to start otherwise); with this on it
  # also refuses an intermediate that has no name constraints. Set true in
  # production.
  requireNameConstraints: false

# ── Object store (telemetry sink) ─────────────────────────────────────────────
objectStore:
  bucket: ""              # S3 bucket / DO Space name (required)
  prefix: "aintercept"      # key prefix
  region: ""              # AWS region, or DO Spaces region (e.g. nyc3)
  # S3-compatible endpoint. REQUIRED for DigitalOcean Spaces / MinIO; leave
  # empty for native AWS S3.
  endpoint: ""            # e.g. https://nyc3.digitaloceanspaces.com
  forcePathStyle: false   # true for MinIO and some S3-compatible stores
  # Flush thresholds (a batch flushes on whichever trips first).
  maxBytes: 5242880       # 5 MiB
  maxEvents: 10000
  maxAgeSeconds: 60
  # Static credentials (DigitalOcean / MinIO only). On AWS leave blank and use
  # IRSA via serviceAccount.roleArn.
  #
  # Two ways to supply them (DO/MinIO):
  #   1. existingSecret (RECOMMENDED for real deploys) — name of a Secret you
  #      create out-of-band with keys `accessKeyId` and `secretAccessKey`. The
  #      credential never passes through `helm --set` (shell history / release
  #      metadata). See docs/DEPLOY_DOKS.md.
  #   2. accessKeyId / secretAccessKey inline — convenient for a throwaway demo;
  #      the chart creates the Secret. Avoid for anything you care about.
  existingSecret: ""      # e.g. aintercept-objectstore (keys: accessKeyId, secretAccessKey)
  accessKeyId: ""
  secretAccessKey: ""

# ── Observer ──────────────────────────────────────────────────────────────────
# Stage 2 of the data pipeline: raw partitions -> shaped Parquet tables under
# <objectStore.prefix>/shaped/ (docs/ui/BUILD_PLAN.md §7.5). One replica.
process:
  enabled: true
  # process's own ServiceAccount (never the observer's). On AWS its role needs
  # list + get on the raw prefix and put + delete under <prefix>/shaped/ (docs/PRODUCTION.md §7). create: false uses an existing one named
  # name. roleArn is IRSA only (empty for Pod Identity).
  serviceAccount:
    create: true
    name: aintercept-process
    roleArn: ""
  # Scheduling. All optional: unset leaves the pod spec as it was.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  # Optional PodDisruptionBudget (off by default). maxUnavailable, or
  # minAvailable if set.
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1
  pollSeconds: 10   # between polls (each lists only new files)
  fullMinutes: 60   # between full listings (one also runs at start)
  resources:
    # The first start processes the whole bucket, 500 files a run. The request is
    # its working size (about 450 MB on a few weeks of data), so the node has room
    # for it: a pod over its request is the first evicted when a node runs short.
    requests: { cpu: "50m", memory: "512Mi" }
    limits: { cpu: "1", memory: "1Gi" }

# The query API (api/), inside the cluster: it reads the processor's tables
# (mirrored into the pod by an `aintercept mirror` sidecar) and raw files through
# the sidecar. ClusterIP only, with a NetworkPolicy admitting no pod: reach it
# with `kubectl port-forward svc/api 8787` (`make remote` does).
api:
  enabled: false
  # api's own ServiceAccount (never the observer's). On AWS its role needs
  # list + get on the telemetry prefix (docs/PRODUCTION.md §7). create: false uses an existing one named
  # name. roleArn is IRSA only (empty for Pod Identity).
  serviceAccount:
    create: true
    name: aintercept-api
    roleArn: ""
  # Scheduling. All optional: unset leaves the pod spec as it was.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  # Optional PodDisruptionBudget (off by default). maxUnavailable, or
  # minAvailable if set.
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1
  # The tables live in a DuckDB file on the pod's disk (`dbSizeLimit`), compressed
  # and paged in under DuckDB's memory limit, so memory doesn't grow with the data.
  # DuckDB's limit: empty = 60% of the container's memory limit (the rest is Python
  # and the responses being built); or a size like "900MB".
  memoryLimit: ""
  threads: 2             # DuckDB's threads (its default is the node's cores, not the CPU limit)
  resources:
    # Memory request = limit: the scheduler reserves all of it, and the pod is the
    # last evicted when a node runs short (docs/INTERCEPTION_ISSUES.md P5).
    requests: { cpu: "500m", memory: "1536Mi" }
    limits: { cpu: "2", memory: "1536Mi" }
  mirror:
    pollSeconds: 10
    resources:
      requests: { cpu: "20m", memory: "64Mi" }
      limits: { cpu: "500m", memory: "256Mi" }
  # The mirrored tables (tens of MB per million rows).
  shapedSizeLimit: 2Gi
  # The API's DuckDB file (about twice the mirrored tables) and its spill space.
  dbSizeLimit: 4Gi
  # The image serves the web UI at / beside the API at /api/v1. To give a small
  # group the UI behind an identity-aware proxy (docs/PRODUCTION.md §5d):
  service:
    type: ClusterIP       # e.g. LoadBalancer for an internal load balancer
    annotations: {}       # e.g. the cloud's internal-LB annotation
  networkPolicy:
    # Who may connect, as NetworkPolicy `from` peers (the ingress gateway, the
    # tunnel connector, a CIDR). Empty: no pod (kubectl port-forward only).
    #   - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: cloudflared } }
    #   - ipBlock: { cidr: 10.0.0.0/16 }
    ingressFrom: []
  # A Gateway API HTTPRoute to the api Service (needs the Gateway API CRDs).
  httpRoute:
    enabled: false
    parentRefs: []        # - { name: internal-gateway, namespace: gateway }
    hostnames: []         # - aintercept.internal.example.com
  # Verify the identity-aware proxy's signed assertion on every request (defense
  # in depth if the proxy is bypassed). Off when jwtHeader is empty. Without a
  # valid assertion: 401; /api/v1/status stays open for probes. The verified
  # email is logged with each request.
  auth:
    jwtHeader: ""         # Cf-Access-Jwt-Assertion, X-Goog-IAP-JWT-Assertion, …
    jwksUrl: ""           # https://<team>.cloudflareaccess.com/cdn-cgi/access/certs
    audience: ""          # the application's AUD tag / audience
    issuer: ""            # optional: https://<team>.cloudflareaccess.com

observer:
  # Scheduling. All optional: unset leaves the pod spec as it was.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  # Optional PodDisruptionBudget (off by default). maxUnavailable, or
  # minAvailable if set.
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1
  bufferSize: 16384
  # On termination, keep serving this long while Envoy's DNS view drops the pod
  # (headless Service, refreshed every 5 s), then drain in-flight streams. A call
  # routed to an observer that already stopped passes through unrecorded.
  shutdownDelaySeconds: 15
  terminationGracePeriodSeconds: 200
  # Operational log level: debug | info | warn | error. Logs are structured JSON
  # on stderr (telemetry events go to stdout).
  logLevel: info
  # Unrecognized-shape sampling: when a transaction flows through but our
  # extractors didn't fully recognize it (no model OR no usage), retain a
  # STRUCTURE-ONLY fingerprint (no content, no secrets) to the same object store
  # under a schema-samples/ prefix, so new providers / changed schemas are easy
  # to find and extend coverage for. Rate-capped per replica.
  schemaSampling:
    enabled: true
    samplesPerMinute: 120
  # Request headers trusted to carry the original client IP, checked in order
  # before the connection's peer address (e.g. ["cf-connecting-ip"] when an L7
  # proxy that sets it sits in front). Leave empty when clients reach the LB
  # directly: any header can be forged by the client, the peer address cannot.
  # To get the real peer through the LB, use envoy.proxyProtocol below.
  clientIPHeaders: []
  # Salt mixed into the API-key hash (key_hash) that pseudonymously identifies
  # callers. The raw key is NEVER stored — only sha256(salt || key). Set a
  # strong, deployment-unique random value; keeping it stable keeps a given key's
  # identity stable across time, and keeping it secret prevents dictionary
  # attacks against known keys and cross-deployment correlation.
  #   Generate: openssl rand -hex 32
  # Supplied via a Secret (keyHashSaltSecret) when set; else this inline value.
  #
  # Sources, first set wins:
  #   keyHashSaltSecretsManagerId — AWS Secrets Manager secret name/ARN, read at
  #     startup with the observer's AWS identity (needs GetSecretValue). The
  #     secret is the salt, or JSON with a "salt" field.
  #   keyHashSaltSecret — an existing Kubernetes Secret with key `salt`.
  #   keyHashSalt — inline (throwaway demos only).
  keyHashSaltSecretsManagerId: ""
  keyHashSalt: ""
  keyHashSaltSecret: ""   # name of an existing Secret with key `salt`
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "500m", memory: "256Mi" }
  # Memory budget: bytes in-flight traffic (buffered bodies, WebSocket state,
  # bodies queued for extraction) may hold per pod. Utilization of it is what
  # Envoy load-balances on (ORCA) and, with autoscaling.mode keda, what the
  # observer scales on. Empty: half the memory limit. GOMEMLIMIT defaults to
  # 90% of the memory limit.
  memoryBudget: ""
  autoscaling:
    enabled: true
    # cpu: an HPA on CPU only. keda: KEDA on CPU or memory-budget utilization,
    # whichever is higher (needs KEDA installed).
    mode: keda
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    # Scale out when the fleet's average budget utilization passes this, well
    # before pods are full: new pods take 30-90s, and open streams stay put.
    targetMemoryBudgetPercent: 55
    pollingInterval: 15
  # Interception-path health check, served on the observer's HTTP port as
  # GET /healthz/path: 200 when every allowlisted host passed its last probe,
  # 503 otherwise, with per-host JSON. Each probe does a TLS handshake through
  # Envoy with the provider's SNI (verified against the interception root),
  # checks the served leaf's remaining validity, and sends one request that must
  # be answered by the real provider. This is the signal an automatic kill
  # switch polls. Mounts only the public CA chain.
  pathProbe:
    enabled: true
    # The Envoy Service by default; the LB's address includes the LB in the check.
    target: "envoy:443"
    interval: "15s"
    # Fail a host whose served leaf expires sooner than this (stalled renewal).
    minLeafValidity: "30m"
    # What to request per allowlist entry, as "entry=host/path" (default: the
    # entry itself at "/"). Bot-protected web hosts get Cloudflare's edge
    # endpoint /cdn-cgi/trace: it proves the path reaches the real edge without
    # loading the app, so the probe never looks like a scraper from the same
    # egress IP as users. A wildcard entry needs a concrete host here or it
    # isn't probed.
    targets:
      - "chatgpt.com=chatgpt.com/cdn-cgi/trace"
      - "ab.chatgpt.com=ab.chatgpt.com/cdn-cgi/trace"
      - "ws.chatgpt.com=ws.chatgpt.com/cdn-cgi/trace"
      - "claude.ai=claude.ai/cdn-cgi/trace"
      - "a.claude.ai=a.claude.ai/cdn-cgi/trace"
      - "cloudflare-ech.com=cloudflare-ech.com/cdn-cgi/trace"
      - "*.oaiusercontent.com=sdmntprcentralus.oaiusercontent.com/"
  # ServiceAccount. On AWS the observer needs s3:PutObject on the telemetry
  # prefix (and secretsmanager:GetSecretValue on the salt, if used). Grant it
  # with an EKS Pod Identity association on this ServiceAccount (nothing to set
  # here), or with IRSA via roleArn. On DO, static keys are used instead.
  serviceAccount:
    create: true
    name: aintercept-observer
    roleArn: ""           # IRSA only (eks.amazonaws.com/role-arn); empty for Pod Identity

# ── Envoy ─────────────────────────────────────────────────────────────────────
envoy:
  # Scheduling. All optional: unset leaves the pod spec as it was.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  # Optional PodDisruptionBudget (off by default). maxUnavailable, or
  # minAvailable if set.
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1
  # CPU request is set above Envoy's idle baseline (~50m) so an idle fleet sits
  # well below the HPA target and scales back down.
  resources:
    requests: { cpu: "250m", memory: "128Mi" }
    limits: { cpu: "1", memory: "512Mi" }
  # Zero-downtime drain on deploy/scale-down, run by the preStop hook: a
  # terminating Envoy sleeps preStopSleepSeconds (so the LB/endpoints stop sending
  # NEW connections), then starts a graceful drain over the admin API and waits
  # until no request is in flight, up to drainTimeSeconds. Only then is it sent
  # SIGTERM (on which Envoy closes listeners at once). Set drainTimeSeconds >=
  # your longest expected in-flight request; the proxy tees streaming LLM turns,
  # so this defaults high. terminationGracePeriod is derived as
  # preStopSleep + drainTime + 20s.
  drain:
    preStopSleepSeconds: 5
    drainTimeSeconds: 180
  # Autoscaling. Two mutually-exclusive modes:
  #   mode: cpu  → plain HPA on CPU utilization. Zero dependencies. CPU is a
  #                rough proxy for a network proxy's load, but works out of the box.
  #   mode: keda → KEDA ScaledObject on Envoy's ACTIVE CONNECTIONS (the load
  #                signal that actually matters for a proxy). Requires KEDA
  #                installed in the cluster; no Prometheus needed — KEDA polls
  #                Envoy's admin /stats endpoint directly.
  autoscaling:
    enabled: true
    mode: keda            # cpu | keda
    minReplicas: 2
    maxReplicas: 20
    # CPU mode:
    targetCPUUtilizationPercentage: 75
    # KEDA mode: target active downstream connections PER POD. KEDA adds pods to
    # keep the sampled per-pod connection count at/under this. Tune to the
    # connections one Envoy replica handles comfortably at your latency target.
    targetConnectionsPerPod: 500
    # How often KEDA polls Envoy's admin stats (seconds).
    pollingInterval: 15
  # Per-device attribution needs Envoy to see the client's real address. Two
  # ways, depending on the load balancer:
  #   - A pass-through LB that keeps the client IP (DO Network LB, AWS NLB with
  #     instance targets): keep proxyProtocol off and set
  #     service.externalTrafficPolicy: Local, so kube-proxy doesn't SNAT it.
  #   - An LB that terminates TCP (DO's default regional LB, AWS NLB with IP
  #     targets): enable proxyProtocol. It sets the cloud LB annotation AND the
  #     Envoy listener filter together; the two must always match, or every
  #     connection is reset.
  proxyProtocol:
    enabled: false
  # Resolvers Envoy uses for the REAL provider hostnames (IPs, port 53). They
  # must never see the client-side DNS override, or traffic loops back into the
  # proxy. Empty = the public 1.1.1.1 / 8.8.8.8. On a cloud VPC, its own resolver
  # (e.g. AWS's VPC base + 2) avoids needing outbound UDP/53 to the internet.
  upstreamDnsResolvers: []
  service:
    type: LoadBalancer
    # Local keeps the client source IP (see above). Cluster spreads load across
    # nodes but rewrites the source to a node IP.
    externalTrafficPolicy: Local
    # Annotations for the Envoy Service, merged OVER the per-cloud defaults the
    # template adds (AWS: aws-load-balancer-type: nlb; DO: tcp passthrough). A key
    # set here replaces the default: e.g. on AWS with the Load Balancer
    # Controller, set aws-load-balancer-type: external plus its scheme/subnet
    # annotations for an internal NLB.
    annotations: {}
    # Optional source CIDRs allowed to reach the load balancer.
    loadBalancerSourceRanges: []

# ── certsvc ───────────────────────────────────────────────────────────────────
certsvc:
  replicas: 2
  # Scheduling. All optional: unset leaves the pod spec as it was.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  # Optional PodDisruptionBudget (off by default). maxUnavailable, or
  # minAvailable if set.
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1
  # Sign leaves with an AWS KMS key instead of a key file: the intermediate's
  # private key is created in KMS (asymmetric SIGN_VERIFY, RSA or ECC NIST) and
  # never leaves it. The intermediate certificate in caSecretName must be issued
  # for that key's public key; certsvc refuses to start if they don't match.
  # certsvc's AWS identity needs kms:GetPublicKey and kms:Sign on the key.
  kms:
    keyId: ""             # key ID, ARN, or alias/...
    region: ""            # defaults to objectStore.region
  # certsvc's own identity (separate from the observer's), for KMS access via an
  # EKS Pod Identity association, or IRSA with roleArn.
  serviceAccount:
    create: true
    name: aintercept-certsvc
    roleArn: ""
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "500m", memory: "256Mi" }
