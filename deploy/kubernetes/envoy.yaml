# Envoy Deployment + Service for the cluster. The Envoy config is supplied via
# ConfigMap (config only — no keys). Leaf keys are minted by certsvc over SDS;
# the only key material in-cluster is the intermediate, held by certsvc via a
# Secret. A cluster Service can expose 443 without a privileged node port.
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
data:
  envoy.yaml: |
    # Placeholder: apply the repo's envoy/envoy.yaml here, adjusting the
    # `upstream` cluster for the real provider (dynamic_forward_proxy + public
    # DNS resolver + sni api.anthropic.com + public root bundle). See
    # docs/architecture.md Decision 3. Kept out of this file to avoid drift with
    # the canonical envoy/envoy.yaml; generate with:
    #   kubectl create configmap envoy-config --from-file=envoy.yaml=envoy/envoy.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy
  labels: { app: envoy }
spec:
  replicas: 2
  selector:
    matchLabels: { app: envoy }
  template:
    metadata:
      labels: { app: envoy }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.32-latest
          args: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
          ports:
            - { name: https, containerPort: 443 }
            - { name: admin, containerPort: 9901 }
          volumeMounts:
            - { name: config, mountPath: /etc/envoy, readOnly: true }
          readinessProbe:
            httpGet: { path: /ready, port: 9901 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /ready, port: 9901 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "1", memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: config
          configMap: { name: envoy-config }
---
apiVersion: v1
kind: Service
metadata:
  name: envoy
spec:
  type: LoadBalancer # or NodePort; a cluster Service may use 443 directly
  selector: { app: envoy }
  ports:
    - { name: https, port: 443, targetPort: 443 }
