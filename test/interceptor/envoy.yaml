# Envoy for the Interceptor end-to-end test (scripts/test-interceptor.sh).
# Plain HTTP on :10000, no TLS: what's under test is the two ext_proc filters
# and the observer behind them. Host observe.test runs the observing filter,
# enforce.test the enforcing one (FULL_DUPLEX_STREAMED), both in front of the
# fixture. The filters are configured as in the Helm chart.
static_resources:
  listeners:
    - name: http
      address: { socket_address: { address: 0.0.0.0, port_value: 10000 } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: http
                upgrade_configs: [{ upgrade_type: websocket }]
                route_config:
                  virtual_hosts:
                    - name: observe
                      domains: ["observe.test"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: fixture, timeout: 0s }
                    - name: enforce
                      domains: ["enforce.test"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: fixture, timeout: 0s }
                          typed_per_filter_config:
                            aintercept.observe:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                              disabled: true
                            aintercept.enforce:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                              overrides: {}
                http_filters:
                  - name: aintercept.observe
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service: { envoy_grpc: { cluster_name: observer } }
                      observability_mode: true
                      failure_mode_allow: true
                      request_attributes: ["source.address"]
                      processing_mode: { request_header_mode: SEND, response_header_mode: SEND, request_body_mode: STREAMED, response_body_mode: STREAMED, request_trailer_mode: SKIP, response_trailer_mode: SKIP }
                  - name: aintercept.enforce
                    disabled: true
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service: { envoy_grpc: { cluster_name: observer } }
                      failure_mode_allow: false
                      message_timeout: 30s
                      request_attributes: ["source.address"]
                      processing_mode: { request_header_mode: SEND, response_header_mode: SEND, request_body_mode: FULL_DUPLEX_STREAMED, response_body_mode: FULL_DUPLEX_STREAMED, request_trailer_mode: SEND, response_trailer_mode: SEND }
                  - name: envoy.filters.http.router
                    typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }
  clusters:
    - name: fixture
      type: STRICT_DNS
      load_assignment: { cluster_name: fixture, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: fixture, port_value: 8080 } } } }] }] }
    - name: observer
      type: STRICT_DNS
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config: { http2_protocol_options: {} }
      load_assignment: { cluster_name: observer, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: observer, port_value: 9000 } } } }] }] }
admin: { address: { socket_address: { address: 0.0.0.0, port_value: 9901 } } }
